<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #0B1120;
    font-family: 'Inter', -apple-system, "Segoe UI", Arial, sans-serif;
  }
  #stage {
    position: relative; width: 1080px; height: 1920px;
    background: #0B1120;
    color: #F4F6FF;
  }
  #bg-glow { position: absolute; top: -8%; right: -20%; width: 70%; height: 38%; border-radius: 50%; background: radial-gradient(circle, rgba(29,78,216,0.45) 0%, rgba(29,78,216,0) 70%); filter: blur(10px); }
  #bg-dots {
    position: absolute; inset: 0; opacity: 0.3;
    background-image: radial-gradient(rgba(255,255,255,0.14) 2px, transparent 2px);
    background-size: 34px 34px;
  }

  /* Persistent brand lockup, outside the per-frame content div so it never
     gets rebuilt during rendering (performance: scene_renderer re-evaluates
     renderFrame() up to fps times per scene). */
  #brand-row { position: absolute; top: 64px; left: 60px; display: flex; align-items: center; gap: 14px; z-index: 5; }
  .vt-badge {
    width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, #1D4ED8, #10B981);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 22px;
    box-shadow: 0 8px 24px rgba(29, 78, 216, 0.45);
  }
  .vt-wordmark { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 34px; color: #F4F6FF; }

  .center {
    position: absolute; left: 60px; right: 60px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  .title { font-family: 'Sora', sans-serif; font-size: 82px; font-weight: 800; line-height: 1.18; }
  .subtitle { font-size: 42px; font-weight: 500; margin-top: 26px; color: #B9CBFF; }
  .accent { color: #10B981; }
  .point-text { font-family: 'Sora', sans-serif; font-size: 68px; font-weight: 700; line-height: 1.3; }
  .stat { font-family: 'Sora', sans-serif; font-size: 210px; font-weight: 900; color: #34D399; text-shadow: 0 0 50px rgba(16,185,129,0.35); }
  .stat-label { font-size: 46px; margin-top: 18px; color: #D7E0FF; font-weight: 500; }
  .feature-card {
    display: flex; flex-direction: column; gap: 22px; align-items: center;
    background: rgba(255, 255, 255, 0.05); border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 32px; padding: 56px 48px; max-width: 880px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .feature-name { font-family: 'Sora', sans-serif; font-size: 54px; font-weight: 800; color: #93B4FF; }
  .feature-benefit { font-size: 44px; font-weight: 500; line-height: 1.4; }
  .compare {
    display: flex; width: 100%; gap: 32px; justify-content: center;
  }
  .compare-col {
    flex: 1; max-width: 460px; border-radius: 24px; padding: 40px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .compare-left { background: rgba(239, 68, 68, 0.1); border: 1.5px solid rgba(239,68,68,0.5); }
  .compare-right { background: rgba(16, 185, 129, 0.14); border: 1.5px solid #10B981; }
  .compare-label { font-family: 'Sora', sans-serif; font-size: 36px; font-weight: 800; }
  .compare-left .compare-label { color: #FCA5A5; }
  .compare-right .compare-label { color: #6EE7B7; }
  .compare-text { font-size: 34px; line-height: 1.4; }
  .fade-up {
    opacity: 0; transform: translateY(40px);
    transition: none;
  }
  #caption-bar {
    position: absolute; left: 60px; right: 60px; bottom: 150px;
    text-align: center; font-size: 44px; font-weight: 700;
    text-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }
  #caption-bar .current { color: #34D399; }
  #caption-bar .pending { color: #e7eaff; opacity: 0.85; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg-dots"></div>
  <div id="bg-glow"></div>
  <div id="brand-row">
    <span class="vt-badge">VT</span>
    <span class="vt-wordmark">VyaparTrack</span>
  </div>
  <div class="center" id="content"></div>
  <div id="caption-bar"></div>
</div>
<script>
let SCENE = null;

function setScene(scene) {
  SCENE = scene;
  renderFrame(0);
}

function easeOut(x) { return 1 - Math.pow(1 - x, 3); }

function applyEntrance(el, t, delay) {
  const local = Math.max(0, Math.min(1, (t - delay) / 0.4));
  const eased = easeOut(local);
  el.style.opacity = String(eased);
  el.style.transform = `translateY(${(1 - eased) * 40}px)`;
}

function renderContentForType(container, scene, t) {
  const v = scene.visual || {};
  if (scene.type === "title_card" || scene.type === "outro_card") {
    container.innerHTML = `
      <div class="title fade-up" id="el0">${escapeHtml(v.title || "")}</div>
      <div class="subtitle fade-up" id="el1">${escapeHtml(v.subtitle || "")}</div>`;
    applyEntrance(document.getElementById("el0"), t, 0.0);
    applyEntrance(document.getElementById("el1"), t, 0.15);
  } else if (scene.type === "text_point") {
    container.innerHTML = `<div class="point-text fade-up" id="el0">${escapeHtml(v.text || "")}</div>`;
    applyEntrance(document.getElementById("el0"), t, 0.0);
  } else if (scene.type === "stat_card") {
    container.innerHTML = `
      <div class="stat fade-up" id="el0">${escapeHtml(v.stat || "")}</div>
      <div class="stat-label fade-up" id="el1">${escapeHtml(v.label || "")}</div>`;
    applyEntrance(document.getElementById("el0"), t, 0.0);
    applyEntrance(document.getElementById("el1"), t, 0.2);
  } else if (scene.type === "feature_card") {
    container.innerHTML = `
      <div class="feature-card fade-up" id="el0">
        <div class="feature-name">${escapeHtml(v.feature || "")}</div>
        <div class="feature-benefit">${escapeHtml(v.benefit || "")}</div>
      </div>`;
    applyEntrance(document.getElementById("el0"), t, 0.0);
  } else if (scene.type === "comparison") {
    container.innerHTML = `
      <div class="compare fade-up" id="el0">
        <div class="compare-col compare-left">
          <div class="compare-label">${escapeHtml(v.left_label || "")}</div>
          <div class="compare-text">${escapeHtml(v.left_text || "")}</div>
        </div>
        <div class="compare-col compare-right">
          <div class="compare-label">${escapeHtml(v.right_label || "")}</div>
          <div class="compare-text">${escapeHtml(v.right_text || "")}</div>
        </div>
      </div>`;
    applyEntrance(document.getElementById("el0"), t, 0.0);
  } else {
    container.innerHTML = `<div class="point-text">${escapeHtml(v.text || scene.narration || "")}</div>`;
  }
}

function renderCaptions(t) {
  const bar = document.getElementById("caption-bar");
  const words = (SCENE && SCENE.words) || [];
  if (!words.length) { bar.innerHTML = ""; return; }
  let idx = words.findIndex(w => t >= w.start && t < w.end);
  if (idx === -1) {
    idx = words.reduce((acc, w, i) => (w.start <= t ? i : acc), 0);
  }
  const windowStart = Math.max(0, idx - 2);
  const windowEnd = Math.min(words.length, idx + 4);
  const parts = [];
  for (let i = windowStart; i < windowEnd; i++) {
    const cls = i === idx ? "current" : "pending";
    parts.push(`<span class="${cls}">${escapeHtml(words[i].text)}</span>`);
  }
  bar.innerHTML = parts.join(" ");
}

function escapeHtml(s) {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function renderFrame(t) {
  if (!SCENE) return;
  renderContentForType(document.getElementById("content"), SCENE, t);
  renderCaptions(t);
}
window.setScene = setScene;
window.renderFrame = renderFrame;
</script>
</body>
</html>
