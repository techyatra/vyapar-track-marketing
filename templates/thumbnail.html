<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; font-family: 'Inter', -apple-system, "Segoe UI", Arial, sans-serif; }
  #stage {
    width: 1280px; height: 720px; position: relative;
    background: #0B1120;
    display: flex; align-items: center; padding: 0 80px;
  }
  #bg-glow { position: absolute; top: -20%; right: -10%; width: 55%; height: 90%; border-radius: 50%; background: radial-gradient(circle, rgba(29,78,216,0.5) 0%, rgba(29,78,216,0) 70%); filter: blur(8px); }
  #bg-dots {
    position: absolute; inset: 0; opacity: 0.28;
    background-image: radial-gradient(rgba(255,255,255,0.16) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
  }

  #brand-row { position: absolute; top: 44px; left: 64px; display: flex; align-items: center; gap: 12px; z-index: 5; }
  .vt-badge {
    width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0;
    background: linear-gradient(135deg, #1D4ED8, #10B981);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 17px;
    box-shadow: 0 6px 18px rgba(29, 78, 216, 0.45);
  }
  .vt-wordmark { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 26px; color: #F4F6FF; }

  #title {
    position: relative; font-family: 'Sora', sans-serif;
    font-size: 88px; font-weight: 900; color: #F4F6FF; line-height: 1.1;
    max-width: 760px; text-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #title .accent { color: #34D399; }
</style>
</head>
<body>
  <div id="stage">
    <div id="bg-dots"></div>
    <div id="bg-glow"></div>
    <div id="brand-row">
      <span class="vt-badge">VT</span>
      <span class="vt-wordmark">VyaparTrack</span>
    </div>
    <div id="title"></div>
  </div>
<script>
function setThumbnail(data) {
  document.getElementById("title").innerHTML = (data.text || "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}
window.setThumbnail = setThumbnail;
</script>
</body>
</html>
