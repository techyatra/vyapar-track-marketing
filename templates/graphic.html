<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="vt_icons.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Inter', -apple-system, "Segoe UI", Arial, sans-serif; }

  #stage {
    width: 100%; height: 100%; position: relative;
    background: #0B1120;
    color: #F4F6FF; display: flex; flex-direction: column;
  }

  /* Decorative background: soft color blobs + faint dot grid, not a flat gradient */
  #bg-glow-1 { position: absolute; top: -10%; right: -15%; width: 60%; height: 45%; border-radius: 50%; background: radial-gradient(circle, rgba(29,78,216,0.55) 0%, rgba(29,78,216,0) 70%); filter: blur(10px); }
  #bg-glow-2 { position: absolute; bottom: -15%; left: -10%; width: 55%; height: 40%; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,0.35) 0%, rgba(16,185,129,0) 70%); filter: blur(10px); }
  #bg-dots {
    position: absolute; inset: 0; opacity: 0.35;
    background-image: radial-gradient(rgba(255,255,255,0.14) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
  }

  #content-wrap { position: relative; flex: 1; display: flex; flex-direction: column; padding: 64px 72px 0; }

  /* Real VyaparTrack logo lockup: gradient badge + wordmark, matching landing/index.html */
  .vt-logo { display: flex; align-items: center; gap: 14px; }
  .vt-badge {
    width: 52px; height: 52px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(135deg, #1D4ED8, #10B981);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px;
    box-shadow: 0 8px 24px rgba(29, 78, 216, 0.4);
  }
  .vt-wordmark { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 30px; color: #F4F6FF; letter-spacing: -0.01em; }

  .vt-icon-chip {
    width: 76px; height: 76px; border-radius: 20px; margin-top: 40px;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.14);
    display: flex; align-items: center; justify-content: center;
  }
  .vt-icon-chip svg { width: 40px; height: 40px; color: #34D399; }

  #body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  #hook { font-family: 'Sora', sans-serif; font-size: 60px; font-weight: 800; line-height: 1.22; max-width: 760px; margin-top: 22px; }
  #stat { font-family: 'Sora', sans-serif; font-size: 160px; font-weight: 900; color: #34D399; line-height: 1; text-shadow: 0 0 40px rgba(16,185,129,0.35); margin-top: 22px; }
  #label { font-size: 34px; margin-top: 20px; color: #CBD5F5; font-weight: 500; }

  /* Abstract app mockup card: a believable billing-screen shape (skeleton
     rows, no real numbers/names) rather than a specific invented
     screenshot -- gives real "this is software" texture without risking
     a fabricated-data claim in the image itself. */
  #mock-card {
    position: relative; margin-top: 36px; width: 520px;
    background: rgba(17, 26, 51, 0.85); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 22px 24px; backdrop-filter: blur(6px);
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
    transform: rotate(-2deg);
  }
  .mock-titlebar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .mock-dot { width: 10px; height: 10px; border-radius: 50%; }
  .mock-dot.r { background: #ef4444; } .mock-dot.y { background: #f59e0b; } .mock-dot.g { background: #10B981; }
  .mock-titletext { margin-left: 8px; font-size: 20px; font-weight: 600; color: #93A4D8; }
  .mock-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .mock-line { height: 14px; border-radius: 7px; background: rgba(255,255,255,0.14); }
  .mock-total { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1.5px solid rgba(255,255,255,0.12); }
  .mock-total-label { font-size: 20px; font-weight: 700; color: #F4F6FF; }
  .mock-badge { background: rgba(16,185,129,0.18); color: #34D399; font-size: 16px; font-weight: 700; padding: 6px 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .mock-badge svg { width: 16px; height: 16px; }

  /* Footer bar: contrasting solid strip, like a real ad unit's CTA band, not floating text */
  #footer-bar {
    position: relative; margin-top: auto;
    background: linear-gradient(90deg, #1D4ED8, #10B981);
    padding: 28px 72px; display: flex; align-items: center; justify-content: space-between;
  }
  #footer-text { font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 700; color: #ffffff; }
  #footer-sub { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div id="stage">
    <div id="bg-dots"></div>
    <div id="bg-glow-1"></div>
    <div id="bg-glow-2"></div>
    <div id="content-wrap">
      <div class="vt-logo">
        <span class="vt-badge">VT</span>
        <span class="vt-wordmark">VyaparTrack</span>
      </div>
      <div id="body"></div>
    </div>
    <div id="footer-bar">
      <span id="footer-text">Free for 6 months</span>
      <span id="footer-sub">No card required</span>
    </div>
  </div>
<script>
function esc(s) {
  return String(s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

function mockCardHtml() {
  return `
    <div id="mock-card">
      <div class="mock-titlebar">
        <span class="mock-dot r"></span><span class="mock-dot y"></span><span class="mock-dot g"></span>
        <span class="mock-titletext">New GST Bill</span>
      </div>
      <div class="mock-row"><span class="mock-line" style="width:55%"></span><span class="mock-line" style="width:18%"></span></div>
      <div class="mock-row"><span class="mock-line" style="width:40%"></span><span class="mock-line" style="width:18%"></span></div>
      <div class="mock-row"><span class="mock-line" style="width:48%"></span><span class="mock-line" style="width:18%"></span></div>
      <div class="mock-total">
        <span class="mock-total-label">Net GST Payable</span>
        <span class="mock-badge">${VT_ICONS.check}Auto-split</span>
      </div>
    </div>`;
}

function setGraphic(data) {
  const body = document.getElementById("body");
  const iconChip = `<div class="vt-icon-chip">${vtPickIcon((data.hook || "") + " " + (data.label || ""))}</div>`;
  if (data.stat) {
    body.innerHTML = `${iconChip}<div id="stat">${esc(data.stat)}</div><div id="label">${esc(data.label || data.hook || "")}</div>`;
  } else {
    body.innerHTML = `${iconChip}<div id="hook">${esc(data.hook || "")}</div>${mockCardHtml()}`;
  }
}
window.setGraphic = setGraphic;
</script>
</body>
</html>
