<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100vh; overflow: hidden; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  #stage {
    width: 100%; height: 100%; position: relative;
    background: radial-gradient(circle at 50% 25%, #152463 0%, #0B1120 70%);
    color: #F4F6FF;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 90px;
  }
  #badge {
    position: absolute; top: 56px; left: 56px;
    font-size: 30px; font-weight: 800; color: #10B981;
    letter-spacing: 2px; text-transform: uppercase;
  }
  #hook { font-size: 70px; font-weight: 800; line-height: 1.25; }
  #stat { font-size: 170px; font-weight: 900; color: #10B981; line-height: 1; }
  #label { font-size: 38px; margin-top: 20px; color: #D7E0FF; }
  #footer {
    position: absolute; bottom: 56px; left: 0; right: 0;
    text-align: center; font-size: 28px; color: #B9CBFF; font-weight: 600;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="badge">VyaparTrack</div>
    <div id="content"></div>
    <div id="footer">Free 6-month trial &middot; No card required</div>
  </div>
<script>
function esc(s) {
  return String(s || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}
function setGraphic(data) {
  const content = document.getElementById("content");
  if (data.stat) {
    content.innerHTML = `<div id="stat">${esc(data.stat)}</div><div id="label">${esc(data.label || data.hook || "")}</div>`;
  } else {
    content.innerHTML = `<div id="hook">${esc(data.hook || "")}</div>`;
  }
}
window.setGraphic = setGraphic;
</script>
</body>
</html>
